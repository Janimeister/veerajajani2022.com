version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Angular framework + toolchain must upgrade in lockstep (strict peer deps).
      # PrimeNG and @primeuix/* pin an exact Angular major, so they belong here too.
      # Listed first: a dependency joins the first group it matches.
      angular:
        patterns:
          - "@angular/*"
          - "zone.js"
          - "primeng"
          - "@primeuix/*"
          - "typescript"
          - "vitest"
      dev-dependencies:
        dependency-type: development
        # Keep Angular's runtime and build/test peers in the same PR.
        exclude-patterns:
          - "@angular/*"
          - "zone.js"
          - "primeng"
          - "@primeuix/*"
          - "typescript"
          - "vitest"
    ignore:
      # The Angular 22 toolchain pins `peer typescript@">=6.0 <6.1"`, so both
      # major and minor TypeScript bumps break `npm ci`. Only patches are safe;
      # `ng update` moves TypeScript as part of the Angular upgrade itself.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      # @angular/build 22 requires Vitest ^4.0.8; upgrade with the builder.
      - dependency-name: vitest
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
