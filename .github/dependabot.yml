version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Angular framework + toolchain must upgrade in lockstep (strict peer deps).
      # PrimeNG and @primeuix/* pin an exact Angular major, so they belong here too.
      # Listed first: a dependency joins the first group it matches.
      angular:
        patterns:
          - "@angular/*"
          - "zone.js"
          - "primeng"
          - "@primeuix/*"
      dev-dependencies:
        dependency-type: development
    ignore:
      # The Angular 22 toolchain pins `peer typescript@">=6.0 <6.1"`, so a
      # TypeScript major bump breaks `npm ci`. Let the angular group drive it.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
