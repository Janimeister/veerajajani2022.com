name: Tests

on:
  pull_request:
  workflow_call:
    inputs:
      called_from_deploy:
        description: Set to true when called from the deploy workflow to prevent cancelling in-flight deploys
        type: boolean
        default: false
    secrets:
      PRIMEUI_LICENSE:
        description: PrimeUI (PrimeNG 22) license key
        required: false
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '26'

concurrency:
  group: ${{ inputs['called_from_deploy'] && 'deploy-tests' || format('tests-{0}-{1}', github.event_name, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ !inputs['called_from_deploy'] }}

jobs:
  # Runs in the Playwright image too, so the production smoke test has
  # Chromium without installing it from the runner's apt mirror.
  build:
    name: Build & Type Check
    needs: playwright-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.playwright-image.outputs.image }}
      options: --user 1001 --ipc=host
    timeout-minutes: 30
    env:
      PRIMEUI_LICENSE: ${{ secrets.PRIMEUI_LICENSE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use the repository npm version
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')"
          node --version
          npm --version

      - run: npm ci

      - name: Build (type check + Angular production build)
        run: npm run build -- --base-href /

      - name: Add SPA fallback to the production build
        run: cp dist/veerajajani2022.com/browser/index.html dist/veerajajani2022.com/browser/404.html

      - name: Smoke test the Pages artifact
        run: npm run test:production

      - name: Upload production smoke report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-smoke-build
          path: playwright-production-report/
          if-no-files-found: ignore
          retention-days: 7


  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRIMEUI_LICENSE: ${{ secrets.PRIMEUI_LICENSE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use the repository npm version
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')"
          node --version
          npm --version

      - run: npm ci

      - name: Run unit tests
        run: npm test -- --watch=false

  # The build and E2E jobs run in the official Playwright image, which ships the
  # browsers and their system libraries, so they never wait on the runner's apt
  # mirror.
  # Its tag must match the locked Playwright version, so read it from the
  # lockfile and Dependabot bumps carry the image along.
  playwright-image:
    name: Resolve Playwright image
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: package-lock.json
          sparse-checkout-cone-mode: false

      - id: image
        run: |
          version="$(node -p 'require("./package-lock.json").packages["node_modules/playwright-core"].version')"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected playwright-core version in package-lock.json: $version"
            exit 1
          fi
          echo "image=mcr.microsoft.com/playwright:v$version-noble" >> "$GITHUB_OUTPUT"

  e2e-browsers:
    name: Playwright Tests (${{ matrix.browser }})
    needs: playwright-image
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.playwright-image.outputs.image }}
      # Run as the runner user so the workspace and tool cache stay writable,
      # and share the host IPC namespace so Chromium has enough shared memory.
      options: --user 1001 --ipc=host
    timeout-minutes: 30
    env:
      PRIMEUI_LICENSE: ${{ secrets.PRIMEUI_LICENSE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use the repository npm version
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')"
          node --version
          npm --version

      - run: npm ci

      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.browser }}

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: Playwright Tests
    needs: e2e-browsers
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every browser to pass
        env:
          BROWSER_RESULT: ${{ needs.e2e-browsers.result }}
        run: test "$BROWSER_RESULT" = success
