name: Tests

on:
  pull_request:
  workflow_call:
    inputs:
      called_from_deploy:
        description: Set to true when called from the deploy workflow to prevent cancelling in-flight deploys
        type: boolean
        default: false
    secrets:
      PRIMEUI_LICENSE:
        description: PrimeUI (PrimeNG 22) license key
        required: false
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24'

concurrency:
  group: ${{ inputs['called_from_deploy'] && 'deploy-tests' || format('tests-{0}-{1}', github.event_name, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ !inputs['called_from_deploy'] }}

jobs:
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRIMEUI_LICENSE: ${{ secrets.PRIMEUI_LICENSE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use the repository npm version
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')"
          node --version
          npm --version

      - run: npm ci

      - name: Build (type check + Angular production build)
        run: npm run build -- --base-href /


  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRIMEUI_LICENSE: ${{ secrets.PRIMEUI_LICENSE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use the repository npm version
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')"
          node --version
          npm --version

      - run: npm ci

      - name: Run unit tests
        run: npm test -- --watch=false

  e2e:
    name: Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRIMEUI_LICENSE: ${{ secrets.PRIMEUI_LICENSE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use the repository npm version
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')"
          node --version
          npm --version

      - run: npm ci

      - name: Install Playwright browsers
        run: bash scripts/install-playwright.sh

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
